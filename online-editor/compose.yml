name: profile-editor
services:
  editor:
    build:
      context: ..
      dockerfile: online-editor/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: https://dandi.site
      EDITOR_PATH: /editor
    ports:
      - 127.0.0.1:18789:3000
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
