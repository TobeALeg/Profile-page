server {
    listen 80;
    listen [::]:80;
    server_name dandi.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://dandi.site$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dandi.site;
    ssl_certificate /etc/letsencrypt/live/dandi.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dandi.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512k;

    location = / {
        return 302 https://tobealeg.github.io/Profile-page/;
    }
    location = /editor {
        return 301 /editor/;
    }
    location /editor/ {
        proxy_pass http://127.0.0.1:18789;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        # OAuth callback codes must not appear in access logs.
        access_log off;
    }
    location / {
        return 404;
    }
}
